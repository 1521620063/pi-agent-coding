<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 背景渐变：深黑棕底色 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181410"/>
      <stop offset="100%" stop-color="#2c2219"/>
    </linearGradient>
    <!-- π 主体渐变：主色 rgb(225,176,110)，上亮下暗 -->
    <linearGradient id="piGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5dbb8"/>
      <stop offset="45%" stop-color="#e1b06e"/>
      <stop offset="100%" stop-color="#c48842"/>
    </linearGradient>
    <!-- 柔和投影，模拟浮雕悬浮感 -->
    <filter id="piShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 圆角背景底板，rx 控制圆角大小，和你图标圆角匹配 -->
  <rect width="128" height="128" rx="26" fill="url(#bgGrad)"/>

  <!-- π 路径，复刻你原图圆润造型 -->
  <path
    d="M28 40 h72 M42 40 l-4 44 c-1.2 13 -7 21 -15 27 M86 40 v46 c0 13 7 21 15 23 h7"
    fill="none"
    stroke="url(#piGrad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#piShadow)"
  />
</svg>